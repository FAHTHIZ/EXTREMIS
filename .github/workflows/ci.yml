name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run automated tests
        run: npm test
      - name: Validate built-in capabilities
        run: npm run validate
      - name: Evaluate capability routing
        run: npm run eval
      - name: Check generated catalog and discovery index are current
        run: node bin/extremis.mjs build --check
      - name: Check package contents
        run: npm pack --dry-run

  python:
    name: Python SDK on ${{ matrix.python }}
    # ubuntu-latest (26.04) ships no Python 3.9 build; 24.04 still does.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test the stdlib client
        run: python -m unittest discover -s python/tests -v
      - name: Test the LangChain adapter
        if: matrix.python == '3.13'
        run: |
          python -m pip install --quiet langchain-core
          python -m unittest discover -s python/tests -v
      - name: Build the wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel python --outdir /tmp/dist
