name: One-time historical workflow metadata cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_purge-attribution-runs.yml"

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only workflow runs carrying obsolete co-author trailers
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t run_ids < <(
            gh api --paginate "repos/${REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[]
                | select(.head_commit.message? | test("Co-authored-by: Perplexity"; "i"))
                | .id'
          )

          echo "Matching historical workflow runs: ${#run_ids[@]}"

          for run_id in "${run_ids[@]}"; do
            gh api --method DELETE "repos/${REPOSITORY}/actions/runs/${run_id}"
            echo "Deleted workflow run ${run_id}"
          done

          echo "Historical workflow metadata cleanup complete."
