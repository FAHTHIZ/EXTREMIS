<svg xmlns="http://www.w3.org/2000/svg" width="230" height="30" viewBox="0 0 230 30" role="img" aria-label="security: gated + scanned">
<title>security: gated + scanned</title>
<defs>
<linearGradient id="security-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25212F"/><stop offset="1" stop-color="#17151F"/></linearGradient>
<linearGradient id="security-val" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E89B77"/><stop offset="1" stop-color="#F2A66D"/></linearGradient>
<linearGradient id="security-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E89B77" stop-opacity=".6"/><stop offset=".5" stop-color="#E89B77" stop-opacity=".15"/><stop offset="1" stop-color="#F2A66D" stop-opacity=".55"/></linearGradient>
<linearGradient id="security-shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
