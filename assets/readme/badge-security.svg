}</style>
<g clip-path="url(#security-clip)">
<rect width="230" height="30" fill="url(#security-bg)"/>
<rect x="107.3" y="3" width="120.2" height="24" rx="12" fill="url(#security-val)"/>
<rect class="sw" x="-60" y="0" width="46" height="30" fill="url(#security-shine)" transform="translate(-80 0)"/>
</g>
<rect x=".5" y=".5" width="229" height="29" rx="14.5" fill="none" stroke="url(#security-edge)"/>
<g transform="translate(12 6) scale(.75)" fill="none" stroke="#E89B77" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></g>
<text x="38" y="18.8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#B8AECF" letter-spacing=".04em">SECURITY</text>
<text x="167.4" y="19.4" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#17151F">gated + scanned</text>
