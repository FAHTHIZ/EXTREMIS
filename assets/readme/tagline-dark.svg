<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="132" viewBox="0 0 1280 132" role="img" aria-labelledby="t d">
<title id="t">Every skill your agent needs. Only the ones it uses.</title>
<desc id="d">EXTREMIS plans the task, loads only the capabilities it needs, runs permission-gated tools, verifies the result and finds any public skill when the catalog runs out.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#9B83DB"/><stop offset=".55" stop-color="#E89B77"/><stop offset="1" stop-color="#F2A66D"/></linearGradient></defs>
<style>@media (prefers-reduced-motion: no-preference) {
.l1{animation:up 1s .1s cubic-bezier(.2,.7,.1,1) both}.l2{animation:up 1s .45s cubic-bezier(.2,.7,.1,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}</style>
<text class="l1" x="640" y="58" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="url(#g)" letter-spacing="-.01em">Every skill your agent needs. Only the ones it uses.</text>
<text class="l2" x="640" y="102" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#A99FC2">Plan the task, load just the right capabilities, run gated tools, verify, and find any public skill.</text>
</svg>
