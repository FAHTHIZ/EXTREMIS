<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
<title id="title">EXTREMIS — one intelligence, endless capabilities</title>
<desc id="desc">An animated capability engine diagram. A task is planned, only selected skills are activated, permission-gated tools run, and verification checks report their result.</desc>
