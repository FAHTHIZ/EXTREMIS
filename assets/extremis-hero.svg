<style>
.flow{stroke-dasharray:7 9;animation:flow 4s linear infinite}.spark{filter:drop-shadow(0 0 5px #ffad7b);opacity:.95}.meter{animation:meter 3.2s ease-in-out infinite}.signal{transform-box:fill-box;transform-origin:center;animation:jitter 7s steps(2,end) infinite}
@keyframes flow{to{stroke-dashoffset:-64}}@keyframes meter{0%,100%{opacity:.35;transform:translateX(0)}50%{opacity:1;transform:translateX(12px)}}@keyframes jitter{0%,91%,100%{transform:translate(0,0)}92%{transform:translate(1px,-.5px)}93%{transform:translate(-1px,.5px)}94%{transform:translate(.5px,0)}95%{transform:translate(0,0)}}
@media(prefers-reduced-motion:reduce){.flow,.meter,.signal,.spark{animation:none!important}animateMotion,.spark{display:none!important}}
</style>
</svg>