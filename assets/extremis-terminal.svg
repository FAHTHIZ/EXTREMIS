<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">EXTREMIS CLI workflow preview</title>
<desc id="desc">A terminal-style preview of planning a release-readiness workflow and running verification with EXTREMIS.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11111b"/><stop offset="1" stop-color="#1b1522"/></linearGradient></defs>
<rect width="1100" height="430" rx="22" fill="url(#bg)" stroke="#57455e"/><path d="M1 58H1099" stroke="#4c3c54"/>
<circle cx="28" cy="29" r="6" fill="#ff817e"/><circle cx="49" cy="29" r="6" fill="#f5c36c"/><circle cx="70" cy="29" r="6" fill="#6bd4a7"/>
<text x="550" y="34" text-anchor="middle" fill="#a79ab2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">extremis · capability workflow</text>
<text x="34" y="97" fill="#ffbd89" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="700">$ npx extremis plan "is this build ready to release?"</text>
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
  <text x="34" y="133" fill="#e9def5" font-size="14">Plan <tspan fill="#9e8db0">(workflow: release-readiness, confidence high)</tspan></text>
  <g class="line l1"><circle cx="45" cy="165" r="10" fill="#34263b"/><text x="45" y="169" fill="#ffc18f" font-size="10" text-anchor="middle">1</text><text x="68" y="170" fill="#c4b5d1" font-size="13">[verify] tests <tspan fill="#887997">(quality-assurance)</tspan></text><text x="90" y="190" fill="#8d8199" font-size="11">Confirm the test report has no failures or errors</text><text x="90" y="208" fill="#b9a3c9" font-size="10">tools: test.parse_report</text></g>
  <g class="line l2"><circle cx="45" cy="238" r="10" fill="#34263b"/><text x="45" y="242" fill="#ffc18f" font-size="10" text-anchor="middle">2</text><text x="68" y="243" fill="#c4b5d1" font-size="13">[plan] compat <tspan fill="#887997">(api-design) · optional</tspan></text><text x="90" y="263" fill="#8d8199" font-size="11">Check API changes for breaking changes and versioning</text><text x="90" y="281" fill="#b9a3c9" font-size="10">tools: api.openapi_diff</text></g>
  <g class="line l3"><circle cx="45" cy="311" r="10" fill="#34263b"/><text x="45" y="315" fill="#ffc18f" font-size="10" text-anchor="middle">3</text><text x="68" y="316" fill="#c4b5d1" font-size="13">[verify] security <tspan fill="#887997">(secure-code-review)</tspan></text><text x="90" y="336" fill="#8d8199" font-size="11">Check secrets, flagged dependencies and container issues</text><text x="90" y="354" fill="#b9a3c9" font-size="10">tools: security.secret_scan · code.dependency_inventory</text></g>
  <g class="line l4"><text x="34" y="388" fill="#ffbd89" font-size="13" font-weight="700">$ npx extremis verify --capability quality-assurance --param test_report=junit.xml</text></g>
  <g class="line l5"><rect x="34" y="399" width="9" height="9" rx="2" fill="#61d6aa"/><text x="53" y="408" fill="#9ce5c8" font-size="11">PASSED</text><text x="116" y="408" fill="#c8bdce" font-size="11">No failing or erroring tests in the release candidate</text></g>
</g>
<rect class="cursor" x="34" y="419" width="8" height="3" rx="1.5" fill="#ffbf8f"/>
<style>
.line{opacity:0;animation:reveal .65s ease forwards}.l1{animation-delay:.5s}.l2{animation-delay:1.05s}.l3{animation-delay:1.6s}.l4{animation-delay:2.45s}.l5{animation-delay:3.05s}.cursor{animation:blink .9s steps(2,end) infinite}
@keyframes reveal{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.line{animation:none!important;opacity:1!important;transform:none!important}.cursor{animation:none!important;opacity:0!important}}
</style>
</svg>