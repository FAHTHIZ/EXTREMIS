[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "extremis-client"
version = "0.2.0"
description = "Stdlib Python client for the EXTREMIS capability gateway (MCP over stdio), with an optional LangChain adapter."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]

[project.urls]
Homepage = "https://github.com/FAHTHIZ/EXTREMIS"

[tool.setuptools]
packages = ["extremis"]
